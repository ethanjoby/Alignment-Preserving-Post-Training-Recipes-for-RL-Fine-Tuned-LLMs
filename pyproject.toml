[project]
name = "apr"
version = "0.1.0"
description = "Alignment-Preserving post-training Recipes: measure and reduce the alignment tax of RL fine-tuning"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "trl>=0.19",
    "peft>=0.15",
    "datasets>=3.0",
    "accelerate>=1.3",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
gpu = ["vllm>=0.8", "deepspeed>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
apr-train = "apr.train.run:main"
apr-eval = "apr.evals.run:main"
apr-plot = "apr.analysis.tradeoff:main"
apr-build-anchor = "apr.anchor.build:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apr"]
